input_number:
  tv_room_temperature_comfort:
    min: 6.0
    max: 28.0
    step: 0.5
    name: TV Room Temperature Comfort
    icon: mdi:thermometer-high
    unit_of_measurement: °C

  tv_room_temperature_eco:
    min: 6.0
    max: 28.0
    step: 0.5
    name: TV Room Temperature Eco
    icon: mdi:thermometer-low
    unit_of_measurement: °C

input_datetime:
  tv_room_comfort_start:
    name: TV Room Time Comfort Start
    has_date: false
    has_time: true
    icon: mdi:clock-start

  tv_room_comfort_stop:
    name: TV Room Time Comfort Stop
    has_date: false
    has_time: true
    icon: mdi:clock-end
